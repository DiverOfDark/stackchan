[project]
name = "voice-assistant"
version = "0.2.0"
description = "Femto voice backend: bridges the robot to OpenAI's speech-to-speech model, with Hermes for tool work"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets>=13",       # Live API client (websockets.asyncio)
    "openai>=1.40",         # Hermes speaks the OpenAI chat-completions API
    "aiohttp",
    "loguru",
]

# This is a plain app, not an installable package — uv only manages the deps.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",          # FastAPI TestClient transport
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # so `import bot` works from tests/
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
