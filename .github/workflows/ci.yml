name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: Host crates (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Simulator deps (minifb)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-sheet
          path: target/sheet/
          if-no-files-found: ignore

  backend:
    name: Voice backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # faster-whisper + Piper downloads for the integration tests.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pipecat-tests
          key: models-${{ runner.os }}-whisper-tiny-piper-ru_RU-irina-medium
      - run: uv sync --group dev
      - run: uv run pytest -v

  image:
    name: Voice backend image
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built on every main push, whatever changed: homelab's Argo app pulls
      # sha-<short commit of this repo>, so every commit needs its image.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/diverofdark/stackchan-voice
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry: no Actions-cache quota, readable by
          # PRs, and written by main only.
          cache-from: type=registry,ref=ghcr.io/diverofdark/stackchan-voice:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=registry,ref=ghcr.io/diverofdark/stackchan-voice:buildcache,mode=max,image-manifest=true,oci-mediatypes=true' || '' }}

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  firmware:
    name: Firmware (ESP32-S3)
    runs-on: ubuntu-latest
    needs: web
    env:
      ESP_TOOLCHAIN: 1.97.0.0
      # No debug info in CI: a smaller target/ cache and faster links.
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      # Caches are written by main only; PRs restore main's.
      SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Commit times instead of checkout time, so unchanged sources (path
      # crates, C components) don't look modified to cargo / esp-idf-sys.
      - uses: chetan/git-restore-mtime-action@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Xtensa Rust toolchain. Restored rather than reinstalled: build-std
      # treats the toolchain's std sources as path deps, so fresh mtimes
      # would recompile std and every crate on top of it.
      - id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/.cargo/bin/ldproxy
            ~/exports
          key: esp-toolchain-${{ env.ESP_TOOLCHAIN }}
      - if: steps.toolchain.outputs.cache-hit != 'true'
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
          version: ${{ env.ESP_TOOLCHAIN }}
      - if: steps.toolchain.outputs.cache-hit == 'true'
        name: Use cached toolchain
        run: |
          source ~/exports
          echo "$PATH" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          rustup default esp
      - if: steps.toolchain.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/.cargo/bin/ldproxy
            ~/exports
          key: esp-toolchain-${{ env.ESP_TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: espflash

      # ESP-IDF checkout + its tools: changes only with the IDF config.
      - id: idf
        uses: actions/cache/restore@v4
        with:
          path: firmware/.embuild
          key: esp-idf-${{ hashFiles('firmware/.cargo/config.toml', 'firmware/sdkconfig.defaults', 'firmware/components/**/idf_component.yml', 'firmware/components_esp32s3.lock') }}
      # Build output + crate sources: refreshed on every main push and
      # restored from the newest one, so only what changed recompiles.
      - uses: actions/cache/restore@v4
        with:
          path: |
            firmware/target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: firmware-target-${{ hashFiles('firmware/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            firmware-target-${{ hashFiles('firmware/Cargo.lock') }}-
            firmware-target-

      - name: Wake-word model embedded
        run: python3 tools/wake-word/embed.py --check
      - name: Build
        working-directory: firmware
        run: cargo build --release
      - name: Image
        working-directory: firmware
        run: espflash save-image --chip esp32s3 --flash-size 16mb target/xtensa-esp32s3-espidf/release/femto target/femto.bin

      - if: steps.idf.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: firmware/.embuild
          key: ${{ steps.idf.outputs.cache-primary-key }}
      - if: env.SAVE_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            firmware/target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: firmware-target-${{ hashFiles('firmware/Cargo.lock') }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: femto-firmware
          path: firmware/target/femto.bin
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/target/femto.bin
