## IDF Component Manager manifest.
## Managed components are added per-milestone — keep this list aligned with what
## main.c actually pulls in so build times stay sane.
dependencies:
  idf:
    version: ">=5.3.0"
  # M3: cJSON for HTTP signaling request/response bodies. IDF 6.x dropped the
  # bundled `json` component; pull from the registry.
  espressif/cjson: "^1.7.18"
  # M4+: WebRTC stack. We use the lower-level espressif/esp_peer directly
  # rather than the esp_webrtc convenience wrapper. Rationale: esp_webrtc's
  # in-monorepo `override_path` deps (tempotian/media_lib_sal, av_render) have
  # incompatible esp_codec_dev pin ranges across versions, making it
  # impractical to consume via Component Manager. esp_peer alone gives us the
  # peer-connection lifecycle + Opus + DTLS-SRTP + ICE and lets us own the
  # audio path completely — which we want anyway for the XVF3800 + AEC + wake
  # word gating + format conversion glue.
  espressif/esp_peer: "~1.4"
  # Opus encoder/decoder for the WebRTC audio path. esphome/micro-opus is a
  # direct libopus port with Xtensa DSP + PSRAM optimizations for ESP32-S3,
  # smaller than espressif/esp_audio_codec which bundles many codecs we don't
  # need (AAC/G.711/etc.).
  esphome/micro-opus: "~0.3"
  # M6b: TensorFlow Lite Micro for the wake-word model inference. Lives in
  # the isolated `wake_word` component (firmware/components/wake_word/) so
  # its C++ build flags don't pollute the C sources in main/. Declared here
  # so the Component Manager fetches it on first build.
  espressif/esp-tflite-micro: "^1.3.0"
  # M6b: TensorFlow Lite Micro for microWakeWord inference
  # espressif/esp-tflite-micro: "^1.3.0"
