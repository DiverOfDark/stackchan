{{- if or (eq .Values.stt.provider "elevenlabs") (eq .Values.tts.provider "elevenlabs") -}}
{{- if and (not .Values.elevenlabs.apiKey.existingSecret) .Values.elevenlabs.apiKey.externalSecret.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "voice-assistant.elevenlabsSecretName" . }}
  labels:
    {{- include "voice-assistant.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.elevenlabs.apiKey.externalSecret.store }}
    kind: {{ .Values.elevenlabs.apiKey.externalSecret.storeKind }}
  refreshInterval: {{ .Values.elevenlabs.apiKey.externalSecret.refreshInterval | quote }}
  target:
    name: {{ include "voice-assistant.elevenlabsSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.elevenlabs.apiKey.secretKey }}
      remoteRef:
        key: {{ .Values.elevenlabs.apiKey.externalSecret.remoteKey }}
        property: {{ .Values.elevenlabs.apiKey.externalSecret.property }}
{{- else if and (not .Values.elevenlabs.apiKey.existingSecret) .Values.elevenlabs.apiKey.value -}}
# Inline API key — INSECURE. Prefer elevenlabs.apiKey.externalSecret.enabled=true.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "voice-assistant.elevenlabsSecretName" . }}
  labels:
    {{- include "voice-assistant.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.elevenlabs.apiKey.secretKey }}: {{ .Values.elevenlabs.apiKey.value | quote }}
{{- end -}}
{{- end -}}
