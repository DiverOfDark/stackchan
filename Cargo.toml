[workspace]
resolver = "2"
members = ["crates/femto-core", "crates/femto-render"]
# firmware/ is a separate workspace: it builds with the Xtensa `esp` toolchain.
exclude = ["firmware"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
