; PlatformIO project for ReSpeaker XVF3800 + XIAO ESP32-S3 voice assistant.
;
; Platform pinned to espressif32 6.x → ESP-IDF 5.x → mbedTLS 3.6 deliberately.
; ESP-IDF 6.0 shipped mbedTLS 4.0 which moved ctr_drbg.h, entropy.h, sha256.h
; into mbedtls/private/ and tf-psa-crypto/, expecting all new code to migrate
; to the PSA Crypto API. aconchillo/libpeer (our WebRTC stack — see
; components/libpeer + deps/libpeer/) is written against the mbedTLS 3.x API
; and won't compile against 4.x without a substantial port. Pipecat's own
; pipecat-esp32 reference also CI-builds against IDF 5.x for the same reason.
;
; If we later port libpeer to mbedTLS 4 / PSA, bump this back to ^7.0.0.

[platformio]
; Point PlatformIO at the IDF-native main/ directory instead of its default src/.
src_dir = main

[env:seeed_xiao_esp32s3]
platform = espressif32 @ ^6.0.0
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder, colorize

board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; GCC 14 (toolchain-xtensa-esp-elf @ 14.2.0 shipped with espressif32 6.12)
    ; flags an interprocedural inlining of silk_NLSF2A_find_poly into
    ; silk_NLSF2A as a maybe-uninitialized read (false positive — the path
    ; is unreachable). esphome/micro-opus builds clean on older GCC; we
    ; downgrade the warning instead of patching upstream.
    -Wno-error=maybe-uninitialized

upload_port=/dev/ttyACM0
monitor_port=/dev/ttyACM0