{{- if and (eq .Values.voiceEngine "live") (not .Values.openai.apiKey.existingSecret) -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "voice-assistant.fullname" . }}-openai
  labels:
    {{- include "voice-assistant.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.openai.apiKey.externalSecret.store }}
    kind: {{ .Values.openai.apiKey.externalSecret.storeKind }}
  refreshInterval: {{ .Values.openai.apiKey.externalSecret.refreshInterval | quote }}
  target:
    name: {{ include "voice-assistant.fullname" . }}-openai
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.openai.apiKey.secretKey }}
      remoteRef:
        key: {{ .Values.openai.apiKey.externalSecret.remoteKey }}
        property: {{ .Values.openai.apiKey.externalSecret.property }}
{{- end -}}
