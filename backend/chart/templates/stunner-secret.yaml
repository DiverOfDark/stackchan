{{- if and (not .Values.stunner.auth.existingSecret) .Values.stunner.auth.externalSecret.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "voice-assistant.turnSecretName" . }}
  labels:
    {{- include "voice-assistant.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.stunner.auth.externalSecret.store }}
    kind: {{ .Values.stunner.auth.externalSecret.storeKind }}
  refreshInterval: {{ .Values.stunner.auth.externalSecret.refreshInterval | quote }}
  target:
    name: {{ include "voice-assistant.turnSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    # STUNner's authRef Secret expects keys: type, username, password.
    template:
      engineVersion: v2
      type: Opaque
      data:
        type: "static"
        username: {{ `"{{ .username }}"` }}
        password: {{ `"{{ .password }}"` }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.stunner.auth.externalSecret.remoteKey }}
        property: {{ .Values.stunner.auth.externalSecret.usernameProperty }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.stunner.auth.externalSecret.remoteKey }}
        property: {{ .Values.stunner.auth.externalSecret.passwordProperty }}
{{- else if and (not .Values.stunner.auth.existingSecret) .Values.stunner.auth.password -}}
# Inline TURN credentials — INSECURE. Prefer stunner.auth.externalSecret.enabled=true.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "voice-assistant.turnSecretName" . }}
  labels:
    {{- include "voice-assistant.labels" . | nindent 4 }}
type: Opaque
stringData:
  type: "static"
  username: {{ .Values.stunner.auth.username | quote }}
  password: {{ .Values.stunner.auth.password | quote }}
{{- end -}}
