name: test

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cache the faster-whisper + Piper model downloads across runs so
      # subsequent runs of the integration tests don't re-download.
      - name: Cache HF + Piper models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pipecat-tests
          key: models-${{ runner.os }}-whisper-tiny-piper-ru_RU-irina-medium

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest -v
