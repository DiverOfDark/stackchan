; PlatformIO project for ReSpeaker XVF3800 + XIAO ESP32-S3 voice assistant.
; Pinned IDF >= 5.3 so the IDF Component Manager can install esp-webrtc-solution
; and esp-tflite-micro cleanly. If the stock espressif32 platform falls behind,
; switch to the pioarduino fork:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip

[platformio]
; Point PlatformIO at the IDF-native main/ directory instead of its default src/.
src_dir = main

[env:seeed_xiao_esp32s3]
platform = espressif32 @ ^7.0.0
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder, colorize

board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
