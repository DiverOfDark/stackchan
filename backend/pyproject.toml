[project]
name = "voice-assistant"
version = "0.1.0"
description = "Self-hosted Russian streaming voice assistant (Pipecat + SmallWebRTC)"
requires-python = ">=3.11"
dependencies = [
    # Pipecat with the local-only stack: SmallWebRTC transport, faster-whisper
    # STT, Silero VAD, OpenAI-compatible LLM client, in-process Piper TTS.
    "pipecat-ai[webrtc,whisper,silero,openai,piper]>=1.0.0",
    "fastapi[all]",
    "uvicorn",
    "loguru",
]

# This is a plain app, not an installable package — uv only manages the deps.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",          # FastAPI TestClient transport
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # so `import bot` works from tests/
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
