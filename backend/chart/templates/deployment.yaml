apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voice-assistant.fullname" . }}
  labels:
    {{- include "voice-assistant.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: 300
  strategy:
    type: Recreate
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      {{- include "voice-assistant.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod whenever the ConfigMap (model, voice, persona, …)
        # changes; env vars from envFrom don't reload otherwise.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "voice-assistant.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.wakeSamples.enabled }}
      volumes:
        - name: wake-samples
          persistentVolumeClaim:
            claimName: {{ include "voice-assistant.fullname" . }}-wake-samples
      {{- end }}
      containers:
        - name: voice-assistant
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "voice-assistant.fullname" . }}
          env:
            - name: HERMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "voice-assistant.hermesSecretName" . }}
                  key: {{ .Values.hermes.apiKey.secretKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "voice-assistant.openaiSecretName" . }}
                  key: {{ .Values.openai.apiKey.secretKey }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.wakeSamples.enabled }}
          volumeMounts:
            - name: wake-samples
              mountPath: /data
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.bot | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
