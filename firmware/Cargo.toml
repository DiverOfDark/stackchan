[package]
name = "femto-firmware"
description = "Femto firmware for the M5Stack StackChan (ESP32-S3, ESP-IDF)."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "femto"
path = "src/main.rs"
harness = false

[profile.release]
opt-level = "s"
debug = true

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
embedded-svc = "0.29"
sha2 = "0.11"
log = "0.4"
esp-idf-svc = { version = "0.53", features = ["critical-section"] }
femto-core = { path = "../crates/femto-core", features = ["serde"] }
femto-render = { path = "../crates/femto-render" }
femto-drivers = { path = "../crates/femto-drivers" }
embedded-hal = "1"
embedded-hal-bus = { version = "0.3", features = ["std"] }

[build-dependencies]
embuild = "0.33"

# Hot per-pixel code: optimise for speed, the rest for size.
[profile.release.package.femto-render]
opt-level = 3

[profile.release.package.femto-core]
opt-level = 3

[profile.release.package.fontdue]
opt-level = 3

# femto.local (PRD FR-24)
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8" }

# Camera + face detection (C++ shim over esp32-camera and ESP-DL)
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/femto_vision"]
bindings_header = "components/femto_vision/include/femto_vision.h"
bindings_module = "vision"

# Voice: pipecat's WebRTC/wake-word stack + CoreS3 audio (C/C++ components)
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/libpeer", "components/pv_domain", "components/pv_hal", "components/pv_transport", "components/wake_word", "components/femto_voice"]
bindings_header = "components/femto_voice/include/femto_voice.h"
bindings_module = "voice"
