{{- include "voice-assistant.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "voice-assistant.fullname" . }}
  labels:
    {{- include "voice-assistant.labels" . | nindent 4 }}
data:
  HERMES_BASE_URL: {{ .Values.hermes.baseUrl | quote }}
  HERMES_MODEL: {{ .Values.hermes.model | quote }}
  OPENAI_LIVE_MODEL: {{ .Values.openai.liveModel | quote }}
  OPENAI_LIVE_VOICE: {{ .Values.openai.liveVoice | quote }}
  OPENAI_LIVE_VOICE_PROMPT: {{ .Values.openai.liveVoicePrompt | quote }}
  HTTP_PORT: "7860"
  {{- if .Values.wakeSamples.enabled }}
  WAKE_SAMPLE_DIR: {{ .Values.wakeSamples.dir | quote }}
  WAKE_SAMPLE_MAX: {{ .Values.wakeSamples.maxFiles | quote }}
  {{- if .Values.deviceLogs.enabled }}
  DEVICE_LOG_DIR: {{ .Values.deviceLogs.dir | quote }}
  DEVICE_LOG_KEEP_DAYS: {{ .Values.deviceLogs.keepDays | quote }}
  DEVICE_LOG_MAX_MB_PER_DAY: {{ .Values.deviceLogs.maxMBPerDay | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.stackchan }}
  STACKCHAN_USAGE_URL: {{ .usageUrl | default "" | quote }}
  {{- if .systemPrompt }}
  STACKCHAN_SYSTEM_PROMPT: |-
{{ .systemPrompt | indent 4 }}
  {{- end }}
  {{- end }}
