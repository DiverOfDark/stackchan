## IDF Component Manager manifest.
## Managed components are added per-milestone — keep this list aligned with what
## main.c actually pulls in so build times stay sane.
dependencies:
  idf:
    version: ">=5.3.0"
  # M3: cJSON for HTTP signaling request/response bodies. IDF 6.x dropped the
  # bundled `json` component; pull from the registry.
  espressif/cjson: "^1.7.18"
  # M4+: WebRTC stack — `aconchillo/libpeer`, the open-source upstream of
  # Espressif's `esp_peer`. We tried esp_peer 1.4.1 first; its closed-source
  # `peer_connection.c` + libpeer_default.a binary fed a TURN Channel-Bind
  # response to the mbedTLS DTLS server before the handshake was ready,
  # causing UNEXPECTED_MESSAGE (-0x7700) and aiortc to time out client-side
  # (esp-webrtc-solution#175-adjacent bug, opaque demux race). libpeer is
  # what pipecat-esp32 (Pipecat's officially-supported ESP32 client) uses,
  # has full source so we can patch any future bugs, and reuses our existing
  # /api/offer signaling (without trickle ICE — libpeer gathers
  # synchronously, emits one local SDP with all candidates inlined).
  #
  # NOT consumed via the Component Registry — `sepfy/libpeer` v0.0.3 is
  # stale, and `aconchillo/libpeer` is GitHub-only. Pulled in as a git
  # submodule at firmware/deps/libpeer and wrapped by a thin IDF component
  # shim at firmware/components/libpeer/.
  #
  # SRTP support libpeer needs comes from sepfy/srtp (NOT espressif/esp_libsrtp
  # — different API, esp_peer's transitive dep).
  sepfy/srtp: "^2.0.4"
  # Audio on the WebRTC wire is G.711 µ-law (PCMU), companded in
  # pv_domain/g711.hpp — no codec dependency. We started on Opus
  # (esphome/micro-opus) but its >120 KB SILK scratch only fits in PSRAM on
  # this board and ran slower than real time; G.711 is free and the standard
  # codec for memory-constrained WebRTC devices. See domain/g711.hpp.
  # M6b: TensorFlow Lite Micro for the wake-word model inference. Lives in
  # the isolated `wake_word` component (firmware/components/wake_word/) so
  # its C++ build flags don't pollute the C sources in main/. Declared here
  # so the Component Manager fetches it on first build.
  espressif/esp-tflite-micro: "^1.3.0"
  # M7: debounced GPIO button with short/long-press callbacks. Replaces a
  # hand-rolled 50 Hz polling task in button.c.
  espressif/button: "^4.1.6"
  # M6b: TensorFlow Lite Micro for microWakeWord inference
  # espressif/esp-tflite-micro: "^1.3.0"
