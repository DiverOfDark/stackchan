name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: Host crates (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Simulator deps (minifb)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-sheet
          path: target/sheet/
          if-no-files-found: ignore

  backend:
    name: Voice backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # faster-whisper + Piper downloads for the integration tests.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pipecat-tests
          key: models-${{ runner.os }}-whisper-tiny-piper-ru_RU-irina-medium
      - run: uv sync --group dev
      - run: uv run pytest -v

  image:
    name: Voice backend image
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built on every main push, whatever changed: homelab's Argo app pulls
      # sha-<short commit of this repo>, so every commit needs its image.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/diverofdark/stackchan-voice
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  firmware:
    name: Firmware (ESP32-S3)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
          version: 1.97.0.0
      - uses: taiki-e/install-action@v2
        with:
          tool: espflash
      - uses: actions/cache@v4
        with:
          path: |
            firmware/.embuild
            firmware/target
          key: firmware-${{ hashFiles('firmware/Cargo.lock', 'firmware/sdkconfig.defaults', 'firmware/components/**/CMakeLists.txt', 'firmware/components/**/idf_component.yml') }}
          restore-keys: firmware-
      - name: Wake-word model embedded
        run: python3 tools/wake-word/embed.py --check
      - name: Build
        working-directory: firmware
        run: cargo build --release
      - name: Image
        working-directory: firmware
        run: espflash save-image --chip esp32s3 --flash-size 16mb target/xtensa-esp32s3-espidf/release/femto target/femto.bin
      - uses: actions/upload-artifact@v4
        with:
          name: femto-firmware
          path: firmware/target/femto.bin
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/target/femto.bin
