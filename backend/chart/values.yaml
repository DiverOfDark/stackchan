# Default values for the voice-assistant chart.
# See https://github.com/DiverOfDark/stackchan/tree/main/backend for full docs.

image:
  repository: ghcr.io/diverofdark/stackchan-voice
  tag: latest
  pullPolicy: Always

replicaCount: 1
nameOverride: ""
fullnameOverride: ""
podLabels: {}

# ── Hermes: the agent the voice model delegates to (OpenAI-compatible API) ────────────────────────────────────
hermes:
  # Base URL of the OpenAI-compatible endpoint — must include /v1.
  baseUrl: "http://your-llm.example.com:8000/v1"
  # Exact model name (see GET /v1/models on your endpoint).
  model: ""
  apiKey:
    # Key under which the API key is stored in the K8s Secret.
    secretKey: HERMES_API_KEY
    # Pick ONE source of the API key:
    #   1) externalSecret.enabled = true  (External Secrets Operator)
    #   2) value = "sk-..."                (inline; insecure, OK for dev)
    #   3) existingSecret = "my-secret"    (you create it yourself)
    externalSecret:
      enabled: false
      store: openbao-store
      storeKind: ClusterSecretStore
      refreshInterval: "1h"
      remoteKey: "voice-assistant/hermes"
      property: "api_key"
    value: ""
    existingSecret: ""

# ── Voice model (OpenAI speech-to-speech) ────────────────────────────────
# The robot's audio goes straight to this model, which hears and speaks
# itself and delegates tool work to Hermes (backend/live_engine.py).
openai:
  liveModel: "gpt-live-1"
  # A built-in voice name (e.g. marin, the API default when empty) or the id
  # ("voice_…") of a voice made from a text description with
  # POST /v1/audio/voices. See backend/CLAUDE.md, "Custom voice".
  liveVoice: ""
  # The description a custom voice was made from. OpenAI asks for it to be
  # repeated in the session instructions.
  liveVoicePrompt: ""
  apiKey:
    secretKey: OPENAI_API_KEY
    # Defaults to the key trackhound already keeps in OpenBao. Set
    # existingSecret to use a Secret you create yourself.
    externalSecret:
      store: openbao-store
      storeKind: ClusterSecretStore
      refreshInterval: "1h"
      remoteKey: "trackhound"
      property: "openai_api_key"
    existingSecret: ""

# Femto StackChan (M5Stack desk robot, github.com/DiverOfDark/stackchan):
# bilingual butler persona + live Claude usage from trmnl-cyberpunk.
stackchan:
  # trmnl-cyberpunk base URL (serves /api/stackchan/usage). Empty = no usage.
  usageUrl: ""
  # Optional override of the persona ({name}/{honorific} placeholders).
  systemPrompt: ""
  # Bearer token if trmnl-cyberpunk sets STACKCHAN_TOKEN: put
  # STACKCHAN_USAGE_TOKEN in the existing secret (envFrom).

# ── Wake-sample collection ───────────────────────────────────────────────
# The device uploads the audio that triggered each wake fire (+ metrics) to
# /wake-sample; we persist it here to build a labelled real/false corpus for
# retraining the wake-word model. Disable to turn the whole feature off.
wakeSamples:
  enabled: true
  dir: /data/wake-samples    # WAKE_SAMPLE_DIR (under the mounted PVC)
  maxFiles: 1000             # WAKE_SAMPLE_MAX — rotate oldest beyond this
  size: 2Gi
  storageClassName: ""       # empty -> cluster default
  accessModes: [ReadWriteOnce]

# Device logs: the Femto firmware uploads its log (POST /api/device-logs);
# kept as one file per device per UTC day on the wakeSamples volume (/data),
# so it needs wakeSamples.enabled. Read back via GET /api/device-logs.
deviceLogs:
  enabled: true
  dir: /data/device-logs     # DEVICE_LOG_DIR
  keepDays: 14               # DEVICE_LOG_KEEP_DAYS
  maxMBPerDay: 50            # DEVICE_LOG_MAX_MB_PER_DAY

# ── HTTP service (robot WebSocket + web pages) ──────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 7860

# ── Ingress ─────────────────────────────────
ingress:
  enabled: true
  className: ""              # e.g. traefik, nginx; empty uses cluster default
  annotations: {}
  host: voice-assistant.example.com
  tls:
    enabled: true
    secretName: ""           # empty -> "<fullname>-tls"

# ── Resources ────────────────────────────────────────────────────────────
# The backend only relays audio and text; no models run in the pod.
resources:
  bot:
    requests:
      cpu: "50m"
      memory: 128Mi
    limits:
      memory: 512Mi

# Extra env entries appended to the bot container.
extraEnv: []

# ── Pod scheduling ───────────────────────────────────────────────────────
# Pin to a specific node, tolerate taints, or use full affinity rules.
# All empty by default -> scheduler picks any eligible node.
nodeSelector: {}
tolerations: []
affinity: {}
