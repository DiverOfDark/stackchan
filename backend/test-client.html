<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Голосовой помощник</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1e293b, #0b1120);
    color: #e2e8f0;
  }
  .card {
    width: min(440px, 92vw); background: #111827; border: 1px solid #1f2937;
    border-radius: 18px; padding: 32px; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 650; }
  .sub { margin: 0 0 24px; font-size: 13px; color: #94a3b8; }
  .orb {
    width: 96px; height: 96px; margin: 8px auto 20px; border-radius: 50%;
    background: #1e293b; border: 2px solid #334155;
    display: flex; align-items: center; justify-content: center; font-size: 38px;
    transition: all .2s ease;
  }
  .orb.live { border-color: #22c55e; box-shadow: 0 0 0 8px rgba(34,197,94,.12); }
  .orb.connecting { border-color: #eab308; }
  button {
    width: 100%; padding: 13px 20px; font-size: 15px; font-weight: 600;
    border: none; border-radius: 11px; cursor: pointer; color: #fff;
    background: #2563eb; transition: background .15s ease;
  }
  button:hover { background: #1d4ed8; }
  button.stop { background: #dc2626; }
  button.stop:hover { background: #b91c1c; }
  button:disabled { background: #334155; cursor: not-allowed; }
  button:disabled:hover { background: #334155; }
  .text-row {
    display: flex; gap: 8px; margin-top: 14px;
  }
  .text-row input[type="text"] {
    flex: 1; padding: 11px 14px; font-size: 14px;
    background: #0b1120; border: 1px solid #334155; border-radius: 11px;
    color: #e2e8f0; font-family: inherit;
  }
  .text-row input[type="text"]:focus {
    outline: none; border-color: #2563eb;
  }
  .text-row input[type="text"]:disabled {
    background: #0b1120; color: #475569;
  }
  .text-row button {
    width: auto; padding: 11px 18px; font-size: 14px;
  }
  .status { margin: 16px 0 0; font-size: 13px; color: #94a3b8; }
  .status b { color: #e2e8f0; }
  #log {
    margin-top: 18px; text-align: left; font-size: 11px; line-height: 1.5;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #64748b; max-height: 130px; overflow-y: auto;
    background: #0b1120; border: 1px solid #1f2937; border-radius: 9px; padding: 10px;
  }
  /* Live transcript log — every parsed user input + assistant reply, across all sessions. */
  .transcripts-header {
    margin: 22px 0 6px; text-align: left;
    display: flex; align-items: baseline; gap: 8px;
  }
  .transcripts-header h2 {
    margin: 0; font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em; color: #94a3b8;
  }
  .transcripts-header .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #64748b; transition: background 0.2s;
  }
  .transcripts-header .live-dot.connected { background: #22c55e; }
  #transcripts {
    text-align: left; font-size: 13px; line-height: 1.45;
    max-height: 280px; overflow-y: auto;
    background: #0b1120; border: 1px solid #1f2937; border-radius: 9px;
    padding: 10px;
  }
  .tr-row { padding: 5px 0; border-bottom: 1px solid #111827; }
  .tr-row:last-child { border-bottom: none; }
  .tr-meta { display: block; font-size: 10px; color: #64748b; font-family: ui-monospace, monospace; }
  .tr-role { font-weight: 600; }
  .tr-role.user { color: #60a5fa; }
  .tr-role.assistant { color: #f472b6; }
  .tr-text { color: #e2e8f0; }
</style>
</head>
<body>
<div class="card">
  <h1>Голосовой помощник</h1>
  <p class="sub">Локальный ассистент · STT · LLM · TTS · WebRTC</p>
  <div class="orb" id="orb">🎙️</div>
  <button id="btn">Подключиться и говорить</button>
  <div class="text-row">
    <input type="text" id="text-input" placeholder="…или напечатайте текст" disabled />
    <button id="text-send-btn" disabled>Отправить</button>
  </div>
  <p class="status">Состояние: <b id="state">отключено</b></p>
  <div id="log"></div>
  <div class="transcripts-header">
    <h2>Транскрипт (все сессии)</h2>
    <span class="live-dot" id="transcripts-dot" title="SSE статус"></span>
  </div>
  <div id="transcripts"></div>
  <audio id="audio" autoplay></audio>
</div>
<script>
const btn = document.getElementById("btn");
const orb = document.getElementById("orb");
const stateEl = document.getElementById("state");
const audioEl = document.getElementById("audio");
const logEl = document.getElementById("log");
const textInput = document.getElementById("text-input");
const textSendBtn = document.getElementById("text-send-btn");

let pc = null;
let micStream = null;
let active = false;

function setTextInputEnabled(enabled) {
  textInput.disabled = !enabled;
  textSendBtn.disabled = !enabled;
  if (!enabled) textInput.value = "";
}

function log(msg) {
  const t = new Date().toLocaleTimeString("ru-RU");
  logEl.innerHTML += `[${t}] ${msg}<br>`;
  logEl.scrollTop = logEl.scrollHeight;
}
function setState(text, cls) {
  stateEl.textContent = text;
  orb.className = "orb" + (cls ? " " + cls : "");
}

// ICE servers come from the bot — they point the browser at the in-cluster
// STUNner TURN relay, which is how browser media reaches the pod network.
async function getIceServers() {
  try {
    const r = await fetch("/ice-servers");
    const j = await r.json();
    log(`ICE-серверов получено: ${j.iceServers.length}`);
    return j.iceServers || [];
  } catch (e) {
    log("Не удалось получить ICE-серверы: " + e);
    return [];
  }
}

async function sendCandidate(candidate) {
  await fetch("/api/offer", {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      pc_id: pc.pc_id,
      candidates: [{
        candidate: candidate.candidate,
        sdp_mid: candidate.sdpMid,
        sdp_mline_index: candidate.sdpMLineIndex,
      }],
    }),
  });
}

async function connect() {
  setState("подключение…", "connecting");
  btn.textContent = "Отключиться";
  btn.className = "stop";
  active = true;

  micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const iceServers = await getIceServers();
  pc = new RTCPeerConnection({ iceServers });
  pc.pendingCandidates = [];
  pc.canSend = false;

  pc.ontrack = (e) => { audioEl.srcObject = e.streams[0]; };

  pc.oniceconnectionstatechange = () => log("ICE: " + pc.iceConnectionState);
  pc.onconnectionstatechange = () => {
    log("Соединение: " + pc.connectionState);
    if (pc.connectionState === "connected") {
      setState("на связи — говорите", "live");
      setTextInputEnabled(true);
    } else if (["disconnected", "failed", "closed"].includes(pc.connectionState)) {
      if (active) disconnect();
    }
  };
  pc.onicecandidate = async (e) => {
    if (!e.candidate) return;
    if (pc.canSend && pc.pc_id) await sendCandidate(e.candidate);
    else pc.pendingCandidates.push(e.candidate);
  };

  // SmallWebRTCTransport expects both an audio and a video transceiver.
  pc.addTransceiver(micStream.getAudioTracks()[0], { direction: "sendrecv" });
  pc.addTransceiver("video", { direction: "sendrecv" });

  await pc.setLocalDescription(await pc.createOffer());
  const resp = await fetch("/api/offer", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
  });
  const answer = await resp.json();
  pc.pc_id = answer.pc_id;
  await pc.setRemoteDescription(answer);
  log("Ответ SDP получен, pc_id=" + answer.pc_id);

  pc.canSend = true;
  for (const c of pc.pendingCandidates) await sendCandidate(c);
  pc.pendingCandidates = [];
}

function disconnect() {
  active = false;
  if (pc) { pc.close(); pc = null; }
  if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
  setState("отключено", "");
  btn.textContent = "Подключиться и говорить";
  btn.className = "";
  setTextInputEnabled(false);
}

async function sendText() {
  const text = textInput.value.trim();
  if (!text || !pc || !pc.pc_id) return;
  log(`Текст → "${text}"`);
  textSendBtn.disabled = true;
  try {
    const r = await fetch("/api/text", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pc_id: pc.pc_id, text }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      log(`Ошибка: ${e.error || r.status}`);
      return;
    }
    textInput.value = "";
  } catch (e) {
    log("Ошибка отправки: " + e);
  } finally {
    if (active) textSendBtn.disabled = false;
  }
}

btn.addEventListener("click", async () => {
  try {
    if (!active) await connect();
    else disconnect();
  } catch (e) {
    log("Ошибка: " + e);
    setState("ошибка", "");
    disconnect();
  }
});

textSendBtn.addEventListener("click", sendText);
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendText();
});

// ---- Live transcript stream (SSE) -----------------------------------
// One persistent connection per page load. Survives the WebRTC session
// going up/down; reconnects with backoff if the server restarts.
const transcriptsEl = document.getElementById("transcripts");
const transcriptsDot = document.getElementById("transcripts-dot");
let transcriptsES = null;
let transcriptsBackoffMs = 1000;
const MAX_TRANSCRIPT_ROWS = 200;

function addTranscriptRow(ev) {
  const dt = new Date(ev.ts * 1000);
  const hh = String(dt.getHours()).padStart(2, "0");
  const mm = String(dt.getMinutes()).padStart(2, "0");
  const ss = String(dt.getSeconds()).padStart(2, "0");
  const time = `${hh}:${mm}:${ss}`;
  const pcShort = (ev.pc_id || "").split("-").pop().slice(0, 8) || "—";
  const via = ev.via ? ` (${ev.via})` : "";

  const row = document.createElement("div");
  row.className = "tr-row";
  const meta = document.createElement("span");
  meta.className = "tr-meta";
  meta.textContent = `${time} · pc=${pcShort}${via}`;
  const body = document.createElement("span");
  const role = document.createElement("span");
  role.className = `tr-role ${ev.role}`;
  role.textContent = ev.role === "user" ? "👤 " : "🤖 ";
  const text = document.createElement("span");
  text.className = "tr-text";
  text.textContent = ev.text;
  body.appendChild(role);
  body.appendChild(text);
  row.appendChild(meta);
  row.appendChild(body);

  transcriptsEl.appendChild(row);
  while (transcriptsEl.children.length > MAX_TRANSCRIPT_ROWS) {
    transcriptsEl.removeChild(transcriptsEl.firstChild);
  }
  transcriptsEl.scrollTop = transcriptsEl.scrollHeight;
}

function connectTranscripts() {
  if (transcriptsES) transcriptsES.close();
  transcriptsES = new EventSource("/api/transcripts/stream");
  transcriptsES.onopen = () => {
    transcriptsDot.classList.add("connected");
    transcriptsBackoffMs = 1000;
  };
  transcriptsES.onmessage = (e) => {
    try {
      addTranscriptRow(JSON.parse(e.data));
    } catch (err) {
      console.warn("bad transcript event", e.data, err);
    }
  };
  transcriptsES.onerror = () => {
    transcriptsDot.classList.remove("connected");
    transcriptsES.close();
    transcriptsES = null;
    setTimeout(connectTranscripts, transcriptsBackoffMs);
    transcriptsBackoffMs = Math.min(transcriptsBackoffMs * 2, 15000);
  };
}

connectTranscripts();
</script>
</body>
</html>
